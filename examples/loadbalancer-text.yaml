server:
  bind: 0.0.0.0:8998

global:
  refresh_interval: 15s
  default_timeout: 5s
  history_size: 20

response_profiles:
  default-json:
    ok:
      status_code: 200
      content_type: application/json
      body: '{"status":"ok"}'
    fail:
      status_code: 503
      content_type: application/json
      body: '{"status":"failed"}'

  hw-lb-text:
    ok:
      status_code: 200
      content_type: text/plain; charset=utf-8
      body: OK
    fail:
      status_code: 503
      content_type: text/plain; charset=utf-8
      body: FAIL

groups:
  public-lb:
    default_profile: hw-lb-text
    profiles: [hw-lb-text, default-json]

checks:
  - name: cloudflare-dns-tcp
    groups: [public-lb]
    type: tcp
    host: 1.1.1.1
    port: 53
    timeout: 2s
    critical: true

  - name: example-http
    groups: [public-lb]
    type: http
    url: https://example.com
    method: GET
    timeout: 5s
    tls_verify: true
    status_code: 200
    expected_body_substring: Example Domain
    critical: true
    debounce:
      fail_after: 2
      recover_after: 2
